- pipeline: "recurring transactions cron pipeline"
  refs:
    - "refs/heads/main"
  events:
    - type: "SCHEDULE"
      cron: "0 10 2 * *" # recurring-transactions reminder + stale-token cleanup (10:00 UTC on the 2nd of each month)
      timezone: "Etc/UTC"
  actions:
    # Replaced Docker container with a high-speed native HTTP trigger
    - action: "Trigger recurring-transactions cron"
      type: "HTTP"
      notification_url: "https://expensify-api-delta.vercel.app/crons/recurring-transactions"
      method: "GET"
      headers:
        - name: "x-cron-token"
          value: "$CRON_SECRET_TOKEN"
        - name: "Content-Type"
          value: "application/json"

