- pipeline: "recurring transactions cron pipeline"
  refs:
    - "refs/heads/main"
  events:
    - type: "SCHEDULE"
      cron: "0 10 2 * *" # recurring-transactions reminder + stale-token cleanup (10:00 UTC on the 2nd of each month)
      timezone: "Etc/UTC"
  actions:
    # Replaced Docker container with a high-speed native HTTP trigger
    - action: "Trigger recurring-transactions cron"
      type: "WEBHOOK"
      url: "https://expensify-api-delta.vercel.app/crons/recurring-transactions"
      method: "POST"
      headers:
        - key: "x-cron-token"
          value: "$CRON_SECRET_TOKEN"
        - key: "Content-Type"
          value: "application/json"
      
      # Alerts you instantly if the Vercel cleanup script fails (4xx/5xx errors)
      on_failure:
        - action: "Notify Failure on Discord"
          type: "DISCORD"
          content: "❌ **Cron Job Failed:** The monthly recurring transactions reminder and stale-token cleanup failed on Vercel."
          webhook_url: "$DISCORD_WEBHOOK_URL"

