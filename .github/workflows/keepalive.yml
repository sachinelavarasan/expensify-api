name: Keepalive Workflow

on:
  schedule:
    - cron: '0 0 1,15 * *' # twice a month, well under the 60-day inactivity limit
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
