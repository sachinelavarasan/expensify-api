name: Scheduled Jobs

on:
  schedule:
    - cron: '0 0 1 * *' # monthly recurring-transactions reminder + stale-token cleanup
  workflow_dispatch: {}

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger recurring-transactions cron
        env:
          CRON_SECRET_TOKEN: ${{ secrets.CRON_SECRET_TOKEN }}
        run: |
          curl -sf -H "x-cron-token: $CRON_SECRET_TOKEN" "https://lendslog-api.vercel.app/crons/recurring-transactions"
