- pipeline: "recurring-transactions-cron"
  trigger_mode: "SCHEDULED"
  trigger_conditions:
    - trigger_condition: "CRON"
      cron_pattern: "0 10 2 * *" # recurring-transactions reminder + stale-token cleanup (10:00 UTC on the 2nd of each month)
      zone_id: "Etc/UTC"
  ref_name: "main"
  ref_type: "BRANCH"
  actions:
    - action: "Trigger recurring-transactions cron"
      type: "BUILD"
      docker_image_name: "curlimages/curl"
      docker_image_tag: "latest"
      execute_commands:
        - curl -sf -H "x-cron-token: $CRON_SECRET_TOKEN" "https://expensify-api-delta.vercel.app/crons/recurring-transactions"

- pipeline: "purge-trash-cron"
  trigger_mode: "SCHEDULED"
  trigger_conditions:
    - trigger_condition: "CRON"
      cron_pattern: "0 8 1 * *" # trash purge (08:00 UTC on the 1st of each month)
      zone_id: "Etc/UTC"
  ref_name: "main"
  ref_type: "BRANCH"
  actions:
    - action: "Trigger purge-trash cron"
      type: "BUILD"
      docker_image_name: "curlimages/curl"
      docker_image_tag: "latest"
      execute_commands:
        - curl -sf -H "x-cron-token: $CRON_SECRET_TOKEN" "https://expensify-api-delta.vercel.app/crons/purge-trash"
